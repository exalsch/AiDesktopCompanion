[package]
name = "AiDesktopCompanion"
version = "0.1.15"
description = "AiDesktopCompanion"
authors = ["exlasch"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2.7"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-dialog = "2.4"
arboard = "3"
enigo = "0.6"
windows = { version = "0.62", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse"
] }
# 0.13 renamed the TLS feature `rustls-tls` -> `rustls`, and moved system proxy
# detection (HTTP_PROXY / HTTPS_PROXY / WinHTTP) behind `system-proxy`, which
# 0.12 did unconditionally - it has to be asked for explicitly now or the app
# stops working behind a corporate proxy. `stream` is used directly by the
# TTS/STT download paths; do not rely on another crate enabling it.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream", "system-proxy"] }
screenshots = "0.8"
image = "0.25"
chrono = "0.4"
once_cell = "1.19"
hound = "3"
symphonia = { version = "0.6", features = [
  "mp3",
  "aac",
  "flac",
  "vorbis",
  "isomp4",
  "wav",
  "ogg",
  "mkv"
] }
base64 = "0.23"
# `transport-sse-client` was dropped in rmcp 3.x; the standalone SSE transport is
# gone and the streamable-HTTP transport covers it. Nothing here used it - the
# frontend already normalizes an `sse` server to `http` before it reaches Rust.
# The reqwest-backed streamable-HTTP client now needs its own feature.
rmcp = { version = "3.1", features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"
# Only the TTS streaming server uses hyper, and only as an HTTP/1 server on
# 127.0.0.1. `hyper-util` supplies the tokio IO adapter that hyper 1.x no longer
# ships itself; `http-body-util` supplies the body types that replaced 0.14's
# built-in `hyper::Body`.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
uuid = { version = "1.0", features = ["v4"] }
tokio-stream = "0.1"
whisper-rs = { version = "0.16", optional = true }
parakeet_rs_jason = { package = "parakeet-rs", git = "https://github.com/jason-ni/parakeet-rs.git", branch = "master", optional = true }
parakeet_rs_alt = { package = "parakeet-rs", version = "=0.2.6", optional = true } # pinned: 0.2.9 requires ort >= rc.11, whose Tensor API it does not compile against
ort = { version = "=2.0.0-rc.10", optional = true, features = ["download-binaries"] } # pinned to match parakeet-rs 0.2.6
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
num_cpus = "1.16"

[features]
default = ["local-stt"]
local-stt = ["whisper-rs", "parakeet_rs_jason", "parakeet_rs_alt", "parakeet_rs_alt/cuda", "ort", "flate2", "tar"]
