[package]
name = "AiDesktopCompanion"
version = "0.1.13"
description = "AiDesktopCompanion"
authors = ["exlasch"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2.7"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-dialog = "2.4"
arboard = "3"
enigo = "0.6"
windows = { version = "0.62", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse"
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
screenshots = "0.8"
image = "0.25"
chrono = "0.4"
once_cell = "1.19"
hound = "3"
symphonia = { version = "0.5", features = [
  "mp3",
  "aac",
  "flac",
  "vorbis",
  "isomp4",
  "wav",
  "ogg",
  "mkv"
] }
base64 = "0.23"
rmcp = { version = "0.2", features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client", "transport-sse-client"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"
hyper = { version = "0.14", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
tokio-stream = "0.1"
whisper-rs = { version = "0.16", optional = true }
parakeet_rs_jason = { package = "parakeet-rs", git = "https://github.com/jason-ni/parakeet-rs.git", branch = "master", optional = true }
parakeet_rs_alt = { package = "parakeet-rs", version = "=0.2.6", optional = true } # pinned: 0.2.9 requires ort >= rc.11, whose Tensor API it does not compile against
ort = { version = "=2.0.0-rc.10", optional = true, features = ["download-binaries"] } # pinned to match parakeet-rs 0.2.6
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
num_cpus = "1.16"

[features]
default = ["local-stt"]
local-stt = ["whisper-rs", "parakeet_rs_jason", "parakeet_rs_alt", "parakeet_rs_alt/cuda", "ort", "flate2", "tar"]
