name: Build Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # 22 is a floor, not a preference: `npm test` runs the changelog and
      # release-prep suites through `node --test`, relying on Node's built-in
      # TypeScript type stripping, which only lands stably from 22.6. Below
      # that the test command fails with an opaque parse error, so do not
      # lower this back to 20.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # `cache-on-failure` is deliberately off. With it on, a run that failed
      # still saved its `app/src-tauri/target`, so one broken build state was
      # handed to every run after it and the job could never heal itself.
      #
      # That is not hypothetical: this workflow failed on every merge from
      # 4df7261 (21 Aug, the ort rc.13 -> rc.10 downgrade) until 26 Aug, always
      # in the WiX `light.exe` step. The same commit went green the moment the
      # cache was deleted, with no code change. `release-windows.yml` kept
      # working throughout only because rust-cache puts the job id in its key,
      # so it had a separate lineage that never took the bad state.
      #
      # Off, a failed run simply saves nothing and the next one restores the
      # last cache that came from a build that actually worked.
      - name: Cache Rust (Cargo + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri

      - name: Install WiX Toolset (for MSI bundling)
        run: choco install wixtoolset -y --no-progress

      # Local STT (Whisper) requires LLVM/Clang for bindgen on Windows.
      - name: Install LLVM (libclang) for local-stt
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      # (Optional) CMake is commonly needed for audio dependencies; add if missing on the runner.
      - name: Ensure CMake (for local-stt)
        run: choco install cmake -y --no-progress

      # - name: Import Windows code signing cert (optional)
      #   if: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
      #   shell: pwsh
      #   run: |
      #     $certPath = "$env:RUNNER_TEMP\\codesign.pfx"
      #     [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
      #     echo "CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      # `npm ci`, matching `release-windows.yml`. `npm install` is free to
      # resolve something the lockfile does not name, so what this job built was
      # not necessarily what the release job would build. The two jobs quietly
      # differing is what made the failure above so confusing: the same command
      # was green in one and red in the other.
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # The only mechanical guarantee that CHANGELOG.md, parse.ts,
      # release-prep.mjs and the changelog-check.sh/release-notes.sh scripts
      # still agree with each other; this is currently the only CI trigger
      # that runs it.
      - name: Run frontend tests
        working-directory: app
        run: npm test

      - name: Build Tauri app (Windows release)
        working-directory: app
        run: npm run tauri -- build

      # - name: Code-sign Windows artifacts (optional)
      #   if: env.CERT_PATH != ''
      #   shell: pwsh
      #   run: |
      #     $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
      #     if (-not $signtool) { throw "signtool.exe not found on PATH. Ensure Windows SDK is installed." }
      #     $timestamp = if ('${{ secrets.WINDOWS_TIMESTAMP_URL }}') { '${{ secrets.WINDOWS_TIMESTAMP_URL }}' } else { 'http://timestamp.digicert.com' }
      #     $bundleRoot = "app\src-tauri\target"
      #     $files = Get-ChildItem $bundleRoot -Include *.exe,*.msi -Recurse -File
      #     if ($files.Count -eq 0) { Write-Host "No signable artifacts found under $bundleRoot." }
      #     foreach ($f in $files) {
      #       & $signtool sign /f $env:CERT_PATH /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /fd SHA256 /td SHA256 /tr $timestamp "$($f.FullName)"
      #     }

      - name: Upload Windows bundle artifacts
        uses: actions/upload-artifact@v5
        with:
          name: AiDesktopCompanion-windows
          path: |
            app/src-tauri/target/release/bundle/**
            app/src-tauri/target/*/release/bundle/**
          if-no-files-found: error
          retention-days: 7
